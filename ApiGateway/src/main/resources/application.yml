spring:
  application:
    name: ApiGateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: OrderService
              uri: lb://ORDERSERVICE
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=2
            - id: InventoryService
              uri: lb://INVENTORYSERVICE
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: 8000