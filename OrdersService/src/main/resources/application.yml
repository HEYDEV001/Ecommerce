resilience4j:
  retry:
    instances:
      inventoryRetry:
        max-attempts: 3
        wait-duration: 10s
  ratelimiter:
    instances:
      inventoryRateLimiter:
        limit-refresh-period: 5s
        limit-for-period: 1
        timeout-duration: 1s
  circuitbreaker:
    instances:
      inventoryCircuitBreaker:
        register-health-indicator: true # Expose circuitbreaker health via actuator
        sliding-window-size: 10 # Size of sliding window for call recording
        sliding-window-type: count_based # Use count-based sliding window
        minimum-number-of-calls: 10 # Minimum number of call before calculating failure rate
        failure-rate-threshold: 50 # If 50% (5 out of 10) calls fail, circuit goes into open state
        wait-duration-in-open-state: 20s # Time the circuit stays OPEN before moving to HALF_OPEN
        permitted-number-of-calls-in-half-open-state: 3 # Number of test call in HALF_OPEN state
        event-consumer-buffer-size: 10 # Buffer size of event logs

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always